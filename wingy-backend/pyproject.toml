[project]
name = "wingy-backend"
version = "0.1.0"
description = "An intelligent game helper and learning assistant powered by OpenAI's Agents SDK"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.4.1,<0.5.0",
    "litellm>=1.80.0",
    "python-dotenv",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "pytest",
    "pytest-asyncio",
    "hatchling",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wingy"]